<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload and Process Files</title>
</head>
<body>
  <h1>Upload Two Text Files</h1>
  <form id="uploadForm" action="http://localhost:5000/upload" method="POST" enctype="multipart/form-data">
    <label for="file1">Select First Text File:</label>
    <input type="file" name="file1" accept=".txt" required><br><br>
    
    <label for="file2">Select Second Text File:</label>
    <input type="file" name="file2" accept=".txt" required><br><br>
    
    <button type="submit">Upload Files</button>
  </form>

  <div id="message" style="display:none;">
    <h2>Processing...</h2>
    <p>Please wait while we process your files.</p>
  </div>

  <div id="downloadLink" style="display:none;">
    <a id="csvDownloadLink" href="#">Download Processed CSV</a>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const messageDiv = document.getElementById('message');
    const downloadDiv = document.getElementById('downloadLink');
    const csvDownloadLink = document.getElementById('csvDownloadLink');

    form.onsubmit = async function(event) {
      event.preventDefault();

      // Show processing message
      messageDiv.style.display = 'block';
      downloadDiv.style.display = 'none';

      const formData = new FormData(form);

      try {
        // Send files to the server
        const response = await fetch('http://localhost:5000/upload', {
          method: 'POST',
          body: formData,
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success) {
            // Show the download link when processing is done
            csvDownloadLink.href = `http://localhost:5000/download/${result.filename}`;
            csvDownloadLink.innerText = 'Download Processed CSV';
            downloadDiv.style.display = 'block';
            messageDiv.style.display = 'none';
          } else {
            alert(result.message || 'Processing failed.');
            messageDiv.style.display = 'none';
          }
        } else {
          alert('File upload failed.');
          messageDiv.style.display = 'none';
        }
      } catch (error) {
        console.error('Error:', error);
        messageDiv.style.display = 'none';
      }
    };
  </script>
</body>
</html>
